name: Scientific Release Gate

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-gate:
    name: scientific-release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest

      - name: Run scientific tests
        run: |
          python -m pytest -q tests/scientific

      - name: Run G0-G10 gate
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python scripts/scientific_gate.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-gate-report
          path: release/reports/scientific_gate_report.json
