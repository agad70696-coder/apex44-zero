name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync locked project dependencies
        run: uv sync --frozen

      - name: Install application and quality dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pytest==9.1.1 ruff==0.13.1 mypy==1.18.2
          uv pip check --python .venv/bin/python

      - name: Critical static checks (errors and undefined names)
        run: uv run ruff check --select E9,F63,F7,F82 IRRE/ apex/ main.py tests/

      - name: Legacy style audit (non-blocking migration report)
        continue-on-error: true
        run: uv run ruff check IRRE/ apex/ main.py tests/

      - name: Type-check hardened components
        env:
          MYPYPATH: ${{ github.workspace }}
        run: |
          uv run mypy --explicit-package-bases --namespace-packages --follow-imports=silent \
            IRRE/discovery/opportunity_scanner.py \
            IRRE/crypto/forensic_signer.py \
            IRRE/ledger/evidence_chain.py \
            IRRE/prediction/predictive_evidence.py \
            IRRE/space/satellite_evidence.py \
            IRRE/medicine/personalized_evidence.py

      - name: Pytest
        run: uv run python -m pytest -q --import-mode=importlib
