name: quality-gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check APEX44/ src/ tests/
      - run: uv run mypy APEX44/ src/
      - run: uv run pytest -q
