name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync locked project dependencies
        run: uv sync --frozen

      - name: Install application and quality dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python pytest==9.1.1 ruff==0.13.1 mypy==1.18.2
          uv pip check --python .venv/bin/python

      - name: Ruff critical checks
        run: uv run ruff check IRRE/ apex/ main.py tests/

      - name: Mypy
        run: uv run mypy IRRE/ apex/ main.py

      - name: Pytest
        run: uv run pytest -q --import-mode=importlib
