name: Self-Evolve - Genesis Loop

on:
  push:
    branches:
      - main
      - 'ci/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  spotlight:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pytest --version

      - name: Run Opportunity Spotlight
        run: |
          mkdir -p data
          python IRRE/discovery/opportunity_scanner.py
          test -s data/opportunity_ledger.jsonl
          cat data/opportunity_ledger.jsonl

      - name: Run Tests
        run: |
          python -m pytest tests/ -v

      - name: TLA+ Formal Check
        run: |
          if command -v tlc >/dev/null 2>&1; then
            tlc -deadlock specs/evidence_chain.tla
          else
            echo "::notice::TLC_NOT_INSTALLED; formal execution was not run"
          fi

      - name: Auto-heal guard
        run: |
          if grep -q '"status": "FAIL"' data/opportunity_ledger.jsonl; then
            echo "::warning::FAIL detected; automated mutation is disabled in this gate"
          else
            echo "No FAIL status recorded by opportunity scanner"
          fi

      - name: Commit opportunity ledger
        if: github.event_name == 'schedule'
        run: |
          git config user.name "APEX44 Self-Evolve"
          git config user.email "self-evolve@apex44.zero"

          git add data/opportunity_ledger.jsonl

          if git diff --cached --quiet; then
            echo "No ledger changes"
          else
            git commit -m "auto: update opportunity ledger"
            git push
          fi
