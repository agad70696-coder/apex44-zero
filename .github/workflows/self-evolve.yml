name: Self-Evolve - Genesis Loop

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours - Genesis Loop
  workflow_dispatch:

jobs:
  spotlight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b130ceea73d27597364c9af683
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install rfc8785 jcs
          pip install -r requirements.txt 2>/dev/null || true
      - name: Run Opportunity Spotlight
        run: |
          mkdir -p data
          python IRRE/discovery/opportunity_scanner.py
          cat data/opportunity_ledger.jsonl || true
      - name: Run Tests (6 passed gate)
        run: |
          python -m pytest tests/ -v || python -m pytest -v
      - name: TLA+ Formal Check (if tlc available)
        run: |
          ls specs/evidence_chain.tla && echo "TLA spec present with Inv_Crypto"
      - name: Auto-heal if FAIL detected
        run: |
          if grep -q '"status": "FAIL"' data/opportunity_ledger.jsonl; then
            echo "FAIL detected - would open PR via agentic CI healer"
            echo "See: https://github.com/devankit57/agentic-ci-healer pattern"
          fi
      - name: Commit opportunity ledger
        run: |
          git config user.name "APEX44 Self-Evolve"
          git config user.email "self-evolve@apex44.zero"
          git add data/opportunity_ledger.jsonl data/opportunity_report.md || true
          git commit -m "auto: spotlight scan $(date -u +%Y-%m-%dT%H:%MZ) - $(cat data/opportunity_ledger.jsonl | tail -1)" || echo "No changes"
          git push || echo "Push skipped"
