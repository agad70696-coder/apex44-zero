name: Self-Evolve - Genesis Loop

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  spotlight:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Verify execution environment
        run: |
          python --version
          python -m pip --version
          python -c "import pytest; print('pytest:', pytest.__version__)"

      - name: Run Opportunity Spotlight
        run: |
          mkdir -p data
          python IRRE/discovery/opportunity_scanner.py
          if [ -f data/opportunity_ledger.jsonl ]; then
            cat data/opportunity_ledger.jsonl
          else
            echo "No opportunity ledger generated."
          fi

      - name: Run Tests
        run: |
          python -m pytest tests/ -v

      - name: TLA+ Formal Check
        run: |
          test -f specs/evidence_chain.tla
          if command -v tlc >/dev/null 2>&1; then
            echo "TLC available"
            tlc specs/evidence_chain.tla
          else
            echo "TLC unavailable; specification presence verified only"
          fi

      - name: Auto-heal if FAIL detected
        if: always()
        run: |
          if [ -f data/opportunity_ledger.jsonl ] &&
             grep -q '"status": "FAIL"' data/opportunity_ledger.jsonl; then
            echo "FAIL detected - auto-heal proposal path available"
          else
            echo "No FAIL record detected."
          fi

      - name: Commit opportunity ledger
        if: success()
        run: |
          git config user.name "APEX44 Self-Evolve"
          git config user.email "self-evolve@apex44.zero"

          if [ -f data/opportunity_ledger.jsonl ] ||
             [ -f data/opportunity_report.md ]; then
            git add data/opportunity_ledger.jsonl data/opportunity_report.md || true

            if git diff --cached --quiet; then
              echo "No ledger changes."
            else
              git commit -m "auto: spotlight scan $(date -u +%Y-%m-%dT%H:%MZ)"
              git push
            fi
          else
            echo "No opportunity artifacts to commit."
          fi
