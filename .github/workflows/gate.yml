name: Gate - QAC Real
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b130ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real QAC Tests
        run: |
          python -c "
          import pathlib
          print('🔒 QAC Real - Requirements check')
          files=['IRRE/README.md','IRRE/core/evidence.py']
          ok=0
          for f in files:
              e=pathlib.Path(f).exists()
              print(f\"{'✅' if e else '❌'} {f}\")
              ok+=e
          try:
              from IRRE.core.evidence import Evidence, Claim
              ev=Evidence('https://example.com')
              c=Claim('test',[ev])
              print('✅ Evidence Law' if c.verify() else '❌ Law failed')
          except Exception as ex:
              print(f'⚠️ Skip: {ex}')
          print('🔒 For Eternity Locked')
          "
