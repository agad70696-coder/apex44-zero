name: 🛡️ APEX-44 Release Gate v1.0

on:
  push:
    branches: [ "main", "رئيسي" ]
  pull_request:
    branches: [ "main", "رئيسي" ]
  release:
    types: [published]

jobs:
  release-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ✅ البند 1 - جميع الاختبارات 100%
        run: |
          pip install pytest
          pytest tests/ -v || (echo "❌ الاختبارات فشلت - ممنوع الإصدار" && exit 1)

      - name: ✅ البند 2+3 - لا Critical & مراجعة
        run: |
          if grep -r "CRITICAL_BUG\|FIXME" --include="*.py".; then
            echo "❌ يوجد أخطاء حرجة"
            exit 1
          fi

      - name: ✅ البند 4+5 - README و CHANGELOG
        run: |
          test -f README.md || (echo "❌ README ناقص" && exit 1)
          test -f CHANGELOG.md || (echo "❌ CHANGELOG ناقص" && exit 1)
          test -f docs/ENGINEERING_STANDARD_v1.0.md || (echo "❌ الدستور ناقص" && exit 1)
          echo "✅ التوثيق كامل"

      - name: ✅ البند 6+7+8+9 - أداء وذاكرة وأمان وإعادة تشغيل
        run: |
          python apex_shield.py --self-check || (echo "❌ فشل إعادة التشغيل" && exit 1)
         ! grep -r "eval(" --include="*.py" src/ || (echo "❌ خطر أمني eval()" && exit 1)
          echo "✅ الأمان والأداء OK"

      - name: ✅ البند 10 - جاهز للـ Tag
        if: github.event_name == 'release'
        run: |
          echo "🟢 كل البنود الـ 10 نجحت - مسموح بالنشر For Eternity"
