name: Python Package CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 flake8==7.3.0
          python -m pip check

      - name: Check critical Python errors
        run: |
          python -m flake8 IRRE/ apex/ main.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: python -m pytest -v --import-mode=importlib
