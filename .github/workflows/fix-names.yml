name: Fix Arabic to English
on: [push]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "apex-bot"
          git config user.email "bot@apex.zero"

          mkdir -p src/shield src/apex/qac data docs examples benchmarks tests

          [ -d "بيانات" ] && cp -r "بيانات"/* data/ 2>/dev/null; rm -rf "بيانات" || true
          [ -d "الوثائق" ] && cp -r "الوثائق"/* docs/ 2>/dev/null; rm -rf "الوثائق" || true
          [ -d "المعايير" ] && cp -r "المعايير"/* docs/ 2>/dev/null; rm -rf "المعايير" || true
          [ -d "المصدر" ] && cp -r "المصدر"/* src/ 2>/dev/null; rm -rf "المصدر" || true
          [ -d "درع" ] && cp -r "درع"/* src/shield/ 2>/dev/null; rm -rf "درع" || true
          [ -d "شخصيات أصلية" ] && cp -r "شخصيات أصلية"/* examples/ 2>/dev/null; rm -rf "شخصيات أصلية" || true
          [ -d "ضمان الجودة أبيكس" ] && cp -r "ضمان الجودة أبيكس"/* src/apex/qac/ 2>/dev/null; rm -rf "ضمان الجودة أبيكس" || true
          [ -d " ضمان الجودةأبيكس" ] && rm -rf " ضمان الجودةأبيكس" || true
          [ -d "/ ضمان الجودةأبيكس" ] && rm -rf "/ ضمان الجودةأبيكس" || true
          find. -type d -name "*أبيكس*" -exec rm -rf {} + 2>/dev/null || true
          find. -type d -name "*المعايير*" -exec rm -rf {} + 2>/dev/null || true

          touch data/.gitkeep docs/.gitkeep src/.gitkeep examples/.gitkeep benchmarks/.gitkeep tests/.gitkeep

          git add -A
          git commit -m "fix: auto-rename Arabic folders to global English standard" || echo "already fixed"
          git push
