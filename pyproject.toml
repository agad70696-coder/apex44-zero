[project]
name = "apex44-zero"
version = "4.6.0"
description = "Quantum-resistant AI evidence ledger - SCITT + TRACE + DGM"
requires-python = ">=3.11"
dependencies = ["rfc8785>=0.1.2"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","C4","SIM","RUF","ANN","PTH","PL","TRY"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
